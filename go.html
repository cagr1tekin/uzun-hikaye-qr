<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0a0a0a" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Uzun Hikaye — Menü</title>

  <link rel="stylesheet" href="css/style.css" />

  <!--
    QR kodun işaret ettiği kalıcı adres.

    Basılı QR bu sayfayı gösterir; bu sayfa da data/yonlendirme.json içindeki
    "hedef" adresine yönlendirir. Menü taşınırsa ya da domain alınırsa sadece
    o JSON dosyası güncellenir — masalardaki QR kodlar aynı kalır.
  -->
</head>
<body class="loaded">
  <div class="grain" aria-hidden="true"></div>
  <div class="glow" aria-hidden="true"></div>

  <main class="go-page" id="go-page">
    <span class="go-dot" aria-hidden="true"></span>
    <h1>Uzun <span>Hikaye</span></h1>
    <p id="go-status">Menü açılıyor…</p>
    <a class="go-link" id="go-link" hidden>Menüyü aç</a>
  </main>

  <script>
    ;(async () => {
      const statusEl = document.getElementById("go-status")
      const linkEl = document.getElementById("go-link")

      function elleAc(hedef, mesaj) {
        statusEl.textContent = mesaj
        linkEl.href = hedef
        linkEl.hidden = false
      }

      try {
        // Önbelleğe takılmasın: hedef değiştiğinde anında geçerli olsun
        const res = await fetch("./data/yonlendirme.json", { cache: "no-store" })
        if (!res.ok) throw new Error("yonlendirme.json okunamadi")
        const cfg = await res.json()

        if (cfg.aktif === false) {
          document.getElementById("go-page").classList.add("go-closed")
          statusEl.textContent =
            cfg.kapaliMesaji || "Menü şu anda kullanılamıyor."
          return
        }

        const hedef = (cfg.hedef || "index.html").trim()
        if (!hedef) throw new Error("hedef bos")

        // Sonsuz döngüyü engelle: hedef bu sayfanın kendisi olamaz
        const cozulmus = new URL(hedef, location.href)
        if (cozulmus.href.replace(/#.*$/, "") === location.href.replace(/#.*$/, "")) {
          throw new Error("hedef bu sayfayi gosteriyor")
        }

        const git = () => location.replace(cozulmus.href)
        const gecikme = Number(cfg.gecikmeMs) || 0
        gecikme > 0 ? setTimeout(git, gecikme) : git()

        // Yönlendirme bir sebeple gerçekleşmezse elle bağlantı sun
        setTimeout(() => elleAc(cozulmus.href, "Menü açılmadıysa dokunun:"), 2500)
      } catch (err) {
        // Yapılandırma okunamazsa menüye doğrudan git — müşteri ekranda kalmasın
        if (location.protocol === "file:") {
          elleAc(
            "index.html",
            "Yerel önizlemede yönlendirme çalışmaz. Baslat.bat ile açın veya:"
          )
        } else {
          location.replace("index.html")
        }
      }
    })()
  </script>
</body>
</html>

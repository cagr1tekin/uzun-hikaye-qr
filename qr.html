<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0a0a0a" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Uzun Hikaye — QR Kod</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Outfit:wght@300;400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />

  <!--
    Kütüphane projeye gömülü. Daha önce jsdelivr'daki bir adres kullanılıyordu,
    o adres 404 döndüğü için QR hiç oluşmuyordu. Yerel dosya hem bu riski
    kaldırır hem de internet olmadan çalışır.
  -->
  <script src="js/vendor/qrcode.min.js"></script>
</head>
<body>
  <div class="grain" aria-hidden="true"></div>
  <div class="glow" aria-hidden="true"></div>

  <main class="qr-page">
    <h1>Uzun <span>Hikaye</span></h1>

    <p>Masalara yapıştırılacak QR kod. Müşteri okutunca menü telefonunda açılır.</p>

    <div class="qr-box">
      <canvas id="qr-canvas" aria-label="Uzun Hikaye menü QR kodu" role="img"></canvas>
    </div>

    <p class="qr-url" id="qr-url"></p>

    <button class="qr-download" id="qr-download" type="button">PNG olarak indir</button>

    <p class="qr-warn">
      Bu adres kalıcıdır, hiçbir zaman değişmez. Menü başka bir adrese taşınırsa
      yönlendirici projesinin hedefi güncellenir — bu QR aynı kalır.
    </p>
  </main>

  <script>
    /**
     * QR'a yazılan adres. BU SATIRI DEĞİŞTİRMEYİN.
     *
     * Burası menü sitesinin adresi değil, yönlendirici projesinin adresidir:
     * https://github.com/cagr1tekin/uzun-hikaye-yonlendirme
     *
     * QR bir kez basılıp masalara yapıştırıldıktan sonra bu adresi değiştirmek,
     * bütün masaları tek tek dolaşmak demektir. Menü taşınacaksa yönlendirici
     * projesindeki vercel.json güncellenir, burası sabit kalır.
     */
    const QR_ADRES = "https://uzun-hikaye-yonlendirme.vercel.app/"

    const canvas = document.getElementById("qr-canvas")
    document.getElementById("qr-url").textContent = QR_ADRES

    // Baski icin yuksek cozunurluk: 220px'lik QR yazdirildiginda bulaniklasiyor.
    // Ekranda 220px gosterilir, indirilen dosya 720px kalir.
    QRCode.toCanvas(canvas, QR_ADRES, {
      width: 720,
      margin: 2,
      errorCorrectionLevel: "H",
      color: { dark: "#0a0a0a", light: "#ffffff" },
    }, (err) => {
      if (err) {
        document.getElementById("qr-url").textContent =
          "QR oluşturulamadı: " + err.message
        return
      }
      canvas.style.width = "220px"
      canvas.style.height = "220px"
    })

    document.getElementById("qr-download").addEventListener("click", () => {
      const a = document.createElement("a")
      a.href = canvas.toDataURL("image/png")
      a.download = "uzun-hikaye-menu-qr.png"
      a.click()
    })
  </script>
</body>
</html>
